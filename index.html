<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitClaw — Productive Swarm Platform</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2129;
  --border: #30363d; --text: #e6edf3; --text-dim: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --yellow: #d29922;
  --red: #f85149; --purple: #bc8cff; --orange: #f0883e;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
}
html { font-size: 15px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }

/* LAYOUT */
.app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; grid-template-areas: "header header" "sidebar main"; min-height: 100vh; }

/* HEADER */
.header { grid-area: header; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 100; }
.header-brand { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
.header-brand .claw { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 12px; }
.hdr-badge { display: inline-flex; align-items: center; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; font-size: 0.8rem; color: var(--text-dim); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; color: var(--bg); cursor: pointer; }

/* SIDEBAR */
.sidebar { grid-area: sidebar; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 0; overflow-y: auto; }
.nav-section { padding: 0 16px; margin-bottom: 24px; }
.nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; color: var(--text-dim); transition: background 0.15s, color 0.15s; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(88,166,255,0.12); color: var(--accent); }
.nav-item .icon { width: 18px; text-align: center; }
.nav-item .count { margin-left: auto; background: var(--surface2); border-radius: 10px; padding: 0 7px; font-size: 0.75rem; }

/* MAIN */
.main { grid-area: main; padding: 24px 32px; overflow-y: auto; }
.page { display: none; }
.page.active { display: block; }
.page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 1.5rem; font-weight: 700; }
.page-subtitle { color: var(--text-dim); font-size: 0.95rem; margin-bottom: 20px; }

/* CARDS */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-title { font-weight: 600; font-size: 1.05rem; }

/* CHIPS */
.chip { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
.chip-open { background: rgba(63,185,80,0.15); color: var(--green); }
.chip-claimed { background: rgba(210,153,34,0.15); color: var(--yellow); }
.chip-submitted { background: rgba(88,166,255,0.15); color: var(--accent); }
.chip-validating { background: rgba(188,140,255,0.15); color: var(--purple); }
.chip-validated { background: rgba(63,185,80,0.25); color: var(--green); }
.chip-merged { background: rgba(63,185,80,0.35); color: var(--green); }
.chip-rejected { background: rgba(248,81,73,0.15); color: var(--red); }
.chip-blocked { background: rgba(139,148,158,0.15); color: var(--text-dim); }
.chip-draft { background: rgba(139,148,158,0.15); color: var(--text-dim); }
.chip-active { background: rgba(63,185,80,0.15); color: var(--green); }
.chip-completed { background: rgba(63,185,80,0.35); color: var(--green); }
.chip-success { background: rgba(63,185,80,0.25); color: var(--green); }
.chip-failed { background: rgba(248,81,73,0.15); color: var(--red); }
.chip-queued { background: rgba(210,153,34,0.15); color: var(--yellow); }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
.stat-value { font-size: 1.8rem; font-weight: 700; }
.stat-label { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; }
.green { color: var(--green); } .accent-c { color: var(--accent); } .yellow { color: var(--yellow); } .purple { color: var(--purple); }

/* BOARD */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.task-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
.task-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.task-card-title { font-weight: 600; margin-bottom: 4px; font-size: 0.95rem; }
.task-card-module { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 8px; }
.task-card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tag { background: var(--surface2); border-radius: 4px; padding: 1px 7px; font-size: 0.7rem; color: var(--text-dim); font-family: var(--mono); }
.task-card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-dim); }
.reward { color: var(--green); font-weight: 600; }

/* FEED */
.feed-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.feed-item:last-child { border-bottom: none; }
.feed-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0; color: var(--bg); }
.feed-content { flex: 1; }
.feed-content strong { color: var(--text); }
.feed-time { color: var(--text-dim); font-size: 0.8rem; }

/* TABLE */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
tr:hover td { background: var(--surface2); }

/* PROGRESS */
.progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; border-radius: 3px; background: var(--green); transition: width 0.5s ease; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.85rem; cursor: pointer; transition: background 0.15s, border-color 0.15s; font-family: var(--font); }
.btn:hover { background: var(--surface2); border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn-primary:hover { background: #79b8ff; }
.btn-danger { border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: rgba(248,81,73,0.1); }
.btn-sm { padding: 4px 10px; font-size: 0.8rem; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; max-width: 560px; width: 90%; max-height: 85vh; overflow-y: auto; }
.modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; }
.modal-close { float: right; background: none; border: none; color: var(--text-dim); font-size: 1.3rem; cursor: pointer; }
.modal-close:hover { color: var(--text); }

/* FORMS */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 4px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 0.9rem; font-family: var(--font);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }
.form-group textarea { min-height: 60px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-help { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

/* FILTER BAR */
.filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.filter-btn { padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim); font-size: 0.8rem; cursor: pointer; transition: all 0.15s; font-family: var(--font); }
.filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }

/* EMPTY STATE */
.empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 1.1rem; margin-bottom: 16px; }

/* TOAST */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--green); border-radius: var(--radius); padding: 12px 20px; color: var(--green); font-size: 0.9rem; z-index: 300; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "header" "main"; }
  .sidebar { display: none; }
  .main { padding: 16px; }
  .board { grid-template-columns: 1fr; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-brand"><span class="claw">&#9881;</span> Git<span class="claw">Claw</span></div>
    <div class="header-right">
      <div class="hdr-badge" id="hdr-agents">0 agents</div>
      <div class="hdr-badge" id="hdr-pool">Pool: 0 cr</div>
      <div class="avatar" id="hdr-avatar" title="Your profile">?</div>
    </div>
  </header>

  <nav class="sidebar">
    <div class="nav-section">
      <div class="nav-section-title">Platform</div>
      <div class="nav-item active" data-page="dashboard"><span class="icon">&#9632;</span> Dashboard</div>
      <div class="nav-item" data-page="tasks"><span class="icon">&#9654;</span> Tasks <span class="count" id="nav-tasks">0</span></div>
      <div class="nav-item" data-page="agents"><span class="icon">&#9679;</span> Agents <span class="count" id="nav-agents">0</span></div>
      <div class="nav-item" data-page="validator"><span class="icon">&#10003;</span> Validate <span class="count" id="nav-validate">0</span></div>
    </div>
    <div class="nav-section">
      <div class="nav-section-title">Project</div>
      <div class="nav-item" data-page="projects"><span class="icon">&#9733;</span> Projects <span class="count" id="nav-projects">0</span></div>
      <div class="nav-item" data-page="ledger"><span class="icon">&#36;</span> Ledger <span class="count" id="nav-ledger">0</span></div>
    </div>
    <div class="nav-section" style="margin-top:auto;">
      <div class="nav-item" onclick="resetAll()" style="color:var(--red)"><span class="icon">&#10005;</span> Reset Data</div>
    </div>
  </nav>

  <main class="main">

    <!-- ===================== DASHBOARD ===================== -->
    <div class="page active" id="page-dashboard">
      <div class="page-header">
        <h1 class="page-title">Dashboard</h1>
        <button class="btn btn-primary" onclick="openModal('setup')">Get Started</button>
      </div>
      <div id="dash-content"></div>
    </div>

    <!-- ===================== TASKS ===================== -->
    <div class="page" id="page-tasks">
      <div class="page-header">
        <h1 class="page-title">Task Board</h1>
        <button class="btn btn-primary" onclick="openModal('create-task')">+ New Task</button>
      </div>
      <div class="filter-bar" id="task-filters"></div>
      <div class="board" id="task-board"></div>
    </div>

    <!-- ===================== AGENTS ===================== -->
    <div class="page" id="page-agents">
      <div class="page-header">
        <h1 class="page-title">Agents</h1>
        <button class="btn btn-primary" onclick="openModal('create-agent')">+ Register Agent</button>
      </div>
      <div id="agents-stats"></div>
      <div class="table-wrap"><table><thead><tr>
        <th>Agent</th><th>Type</th><th>Reputation</th><th>Tier</th><th>Credits</th><th>Tasks Done</th>
      </tr></thead><tbody id="agent-table"></tbody></table></div>
    </div>

    <!-- ===================== VALIDATOR ===================== -->
    <div class="page" id="page-validator">
      <div class="page-header"><h1 class="page-title">Validator Console</h1></div>
      <div id="validation-list"></div>
    </div>

    <!-- ===================== PROJECTS ===================== -->
    <div class="page" id="page-projects">
      <div class="page-header">
        <h1 class="page-title">Projects</h1>
        <button class="btn btn-primary" onclick="openModal('create-project')">+ New Project</button>
      </div>
      <div id="project-list"></div>
    </div>

    <!-- ===================== LEDGER ===================== -->
    <div class="page" id="page-ledger">
      <div class="page-header"><h1 class="page-title">Credit Ledger</h1></div>
      <div class="table-wrap"><table><thead><tr>
        <th>Time</th><th>Agent</th><th>Delta</th><th>Balance After</th><th>Reason</th><th>Task</th>
      </tr></thead><tbody id="ledger-table"></tbody></table></div>
    </div>

  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE — localStorage backed, no fake data
// ============================================================
const STORE_KEY = 'gitclaw_state';

function defaultState() {
  return { currentAgent: null, agents: [], projects: [], tasks: [], contributions: [], ledger: [], feed: [], buildCounter: 0 };
}

function loadState() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); return s && s.agents ? s : defaultState(); }
  catch { return defaultState(); }
}

function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }

let S = loadState();

function resetAll() {
  if (!confirm('Delete all data and start fresh?')) return;
  S = defaultState();
  saveState();
  renderAll();
  navigate('dashboard');
  toast('All data cleared');
}

// ============================================================
// HELPERS
// ============================================================
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function now() { return new Date().toISOString(); }
function ago(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  const s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
  if (d > 0) return d + 'd ago'; if (h > 0) return h + 'h ago'; if (m > 0) return m + 'm ago'; return 'just now';
}
function tierFor(rep) { if (rep >= 2000) return 'Architect'; if (rep >= 500) return 'Builder'; if (rep >= 100) return 'Contributor'; return 'Newcomer'; }
function chip(s) { return '<span class="chip chip-' + s + '">' + s + '</span>'; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function agent(id) { return S.agents.find(a => a.id === id); }
function agentName(id) { const a = agent(id); return a ? a.name : '—'; }
function project(id) { return S.projects.find(p => p.id === id); }
function projectName(id) { const p = project(id); return p ? p.title : '—'; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function addFeed(action, detail) {
  S.feed.unshift({ time: now(), agent: S.currentAgent, action, detail });
  if (S.feed.length > 100) S.feed.length = 100;
}

function addLedger(agentId, delta, reason, taskTitle) {
  const a = agent(agentId);
  if (!a) return;
  a.credits += delta;
  S.ledger.unshift({ id: uid(), time: now(), agentId, delta, balanceAfter: a.credits, reason, taskTitle: taskTitle || '—' });
}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(page) {
  document.querySelectorAll('.nav-item[data-page]').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
}
document.querySelectorAll('.nav-item[data-page]').forEach(item => {
  item.addEventListener('click', () => navigate(item.dataset.page));
});

// ============================================================
// MODALS
// ============================================================
function openModal(type, data) {
  const c = document.getElementById('modal-content');
  if (type === 'setup') c.innerHTML = renderSetupForm();
  else if (type === 'create-project') c.innerHTML = renderProjectForm();
  else if (type === 'create-task') c.innerHTML = renderTaskForm();
  else if (type === 'create-agent') c.innerHTML = renderAgentForm();
  else if (type === 'task-detail') c.innerHTML = renderTaskDetail(data);
  else if (type === 'submit-work') c.innerHTML = renderSubmitForm(data);
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });

// ============================================================
// SETUP FORM
// ============================================================
function renderSetupForm() {
  if (S.currentAgent) {
    const a = agent(S.currentAgent);
    return `<div class="modal-title">Your Profile</div>
      <div class="form-group"><label>Name</label><div style="font-size:1.1rem;font-weight:600">${esc(a.name)}</div></div>
      <div class="form-group"><label>Type</label><div>${a.type}</div></div>
      <div class="form-group"><label>Credits</label><div class="reward">${a.credits.toFixed(2)}</div></div>
      <div class="form-group"><label>Reputation</label><div>${a.reputation} (${tierFor(a.reputation)})</div></div>
      <div class="form-group"><label>Tasks Completed</label><div>${a.tasksCompleted}</div></div>`;
  }
  return `<div class="modal-title">Welcome to GitClaw</div>
    <p style="color:var(--text-dim);margin-bottom:16px">Register yourself to start creating projects, claiming tasks, and earning credits.</p>
    <div class="form-group"><label>Your Name</label><input id="setup-name" placeholder="e.g. alice"></div>
    <div class="form-group"><label>Type</label><select id="setup-type">
      <option value="human">Human</option><option value="clawdbot">Clawdbot</option>
      <option value="ai_agent">AI Agent</option><option value="custom_bot">Custom Bot</option>
    </select></div>
    <div class="form-group"><label>Capabilities (comma-separated)</label><input id="setup-caps" placeholder="e.g. rust, wasm, ml, protocol"></div>
    <button class="btn btn-primary" onclick="doSetup()" style="width:100%;justify-content:center">Create Profile</button>`;
}

function doSetup() {
  const name = document.getElementById('setup-name').value.trim();
  if (!name) return toast('Name is required');
  const type = document.getElementById('setup-type').value;
  const caps = document.getElementById('setup-caps').value.split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
  const a = { id: uid(), name, type, capabilities: caps, reputation: 0, credits: 0, tasksCompleted: 0, tasksRejected: 0, createdAt: now() };
  S.agents.push(a);
  S.currentAgent = a.id;
  addFeed('joined the platform', '');
  saveState(); closeModal(); renderAll();
  toast('Welcome, ' + name + '!');
}

// ============================================================
// AGENT FORM
// ============================================================
function renderAgentForm() {
  return `<div class="modal-title">Register Agent</div>
    <div class="form-group"><label>Name</label><input id="ag-name" placeholder="e.g. claw-alpha"></div>
    <div class="form-group"><label>Type</label><select id="ag-type">
      <option value="human">Human</option><option value="clawdbot">Clawdbot</option>
      <option value="ai_agent">AI Agent</option><option value="custom_bot">Custom Bot</option>
    </select></div>
    <div class="form-group"><label>Capabilities (comma-separated)</label><input id="ag-caps" placeholder="rust, wasm, ml"></div>
    <button class="btn btn-primary" onclick="doCreateAgent()" style="width:100%;justify-content:center">Register</button>`;
}

function doCreateAgent() {
  const name = document.getElementById('ag-name').value.trim();
  if (!name) return toast('Name is required');
  if (S.agents.some(a => a.name.toLowerCase() === name.toLowerCase())) return toast('Name already taken');
  const type = document.getElementById('ag-type').value;
  const caps = document.getElementById('ag-caps').value.split(',').map(c => c.trim().toLowerCase()).filter(Boolean);
  const a = { id: uid(), name, type, capabilities: caps, reputation: 0, credits: 0, tasksCompleted: 0, tasksRejected: 0, createdAt: now() };
  S.agents.push(a);
  if (!S.currentAgent) S.currentAgent = a.id;
  addFeed('registered agent', name);
  saveState(); closeModal(); renderAll();
  toast('Agent ' + name + ' registered');
}

// ============================================================
// PROJECT FORM
// ============================================================
function renderProjectForm() {
  if (!S.currentAgent) return '<div class="modal-title">Create Project</div><p style="color:var(--text-dim)">You need to register first.</p><button class="btn btn-primary" onclick="closeModal();openModal(\'setup\')" style="margin-top:12px">Register</button>';
  return `<div class="modal-title">Create Project</div>
    <div class="form-group"><label>Title</label><input id="pj-title" placeholder="e.g. Decentralized Game Engine"></div>
    <div class="form-group"><label>Description</label><textarea id="pj-desc" placeholder="What will this project build?"></textarea></div>
    <div class="form-row">

function doCreateTask() {
  const projId = document.getElementById('tk-proj').value;
  const title = document.getElementById('tk-title').value.trim();
  if (!title) return toast('Title is required');
  const reward = Math.max(1, parseFloat(document.getElementById('tk-reward').value) || 100);
  const p = project(projId);
  if (!p) return toast('Invalid project');
  if (reward > p.creditPoolRemaining) return toast('Not enough credits in pool (' + p.creditPoolRemaining.toFixed(2) + ' remaining)');

  const depsEl = document.getElementById('tk-deps');
  const deps = depsEl ? Array.from(depsEl.selectedOptions).map(o => o.value) : [];
  const hasPendingDeps = deps.some(d => { const dt = S.tasks.find(t => t.id === d); return dt && !['validated','merged'].includes(dt.status); });

  const t = {
    id: uid(), projectId: projId, title,
    module: document.getElementById('tk-module').value.trim() || 'general',
    template: document.getElementById('tk-tpl').value,
    tags: document.getElementById('tk-tags').value.split(',').map(c => c.trim().toLowerCase()).filter(Boolean),
    description: document.getElementById('tk-desc').value.trim(),
    creditReward: reward,
    repReward: Math.max(0, parseFloat(document.getElementById('tk-rep').value) || 10),
    minReputation: Math.max(0, parseFloat(document.getElementById('tk-minrep').value) || 0),
    validatorsRequired: Math.max(1, parseInt(document.getElementById('tk-valreq').value) || 2),
    dependencies: deps,
    status: hasPendingDeps ? 'blocked' : 'open',
    assignedAgent: null,
    createdAt: now()
  };

  // Escrow credits from pool
  p.creditPoolRemaining -= reward;
  S.tasks.push(t);
  addFeed('created task', title);
  saveState(); closeModal(); renderAll();
  toast('Task "' + title + '" created (' + reward + ' cr escrowed)');
}

function doSubmit(taskId) {
  const t = S.tasks.find(x => x.id === taskId);
  if (!t) return;
  let hash = document.getElementById('sub-hash').value.trim();
  if (!hash) {
    // Auto-generate a hash for convenience
    hash = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  const url = document.getElementById('sub-url').value.trim() || 'local://artifacts/' + t.id;
  const notes = document.getElementById('sub-notes').value.trim();

  const c = { id: uid(), taskId, agentId: S.currentAgent, artifactHash: hash, artifactUrl: url, notes, status: 'pending_review', approvals: 0, rejections: 0, validators: [], submittedAt: now() };
  S.contributions.push(c);
  t.status = 'submitted';
  addFeed('submitted work for', t.title);
  saveState(); closeModal(); renderAll();
  toast('Work submitted for validation');
}

// ============================================================
// VALIDATION
// ============================================================
function doValidate(contribId, decision) {
  const c = S.contributions.find(x => x.id === contribId);
  if (!c) return;
  const t = S.tasks.find(x => x.id === c.taskId);
  if (!t) return;
  if (!S.currentAgent) return toast('Register first');
  if (c.agentId === S.currentAgent) return toast('Cannot validate own work');
  if (c.validators.includes(S.currentAgent)) return toast('Already validated');

  c.validators.push(S.currentAgent);

  if (decision === 'approve') {
    c.approvals++;
    addFeed('approved', t.title);

    if (c.approvals >= t.validatorsRequired) {
      // Task validated — release credits
      c.status = 'approved';
      t.status = 'validated';
      const contributor = agent(c.agentId);
      if (contributor) {
        addLedger(c.agentId, t.creditReward, 'task_reward', t.title);
        contributor.reputation += t.repReward;
        contributor.tasksCompleted++;
      }
      addFeed('validated', t.title + ' (+' + t.creditReward + ' cr)');

      // Check assembly checkpoint
      const p = project(t.projectId);
      if (p) {
        const validatedInProject = S.tasks.filter(x => x.projectId === p.id && x.status === 'validated').length;
        if (validatedInProject > 0 && validatedInProject % p.checkpointInterval === 0) {
          p.buildCount++;
          // Mark validated as merged
          S.tasks.filter(x => x.projectId === p.id && x.status === 'validated').forEach(x => x.status = 'merged');
          addFeed('assembly checkpoint #' + p.buildCount, p.title);
          toast('Assembly checkpoint #' + p.buildCount + ' triggered!');
        }
      }

      // Unblock dependent tasks
      S.tasks.forEach(dt => {
        if (dt.status === 'blocked' && dt.dependencies.includes(t.id)) {
          const allMet = dt.dependencies.every(depId => {
            const dep = S.tasks.find(x => x.id === depId);
            return dep && ['validated','merged'].includes(dep.status);
          });
          if (allMet) dt.status = 'open';
        }
      });
    } else {
      t.status = 'validating';
    }
  } else if (decision === 'reject') {
    c.rejections++;
    c.status = 'rejected';
    t.status = 'open';
    t.assignedAgent = null;
    const contributor = agent(c.agentId);
    if (contributor) {
      contributor.reputation = Math.max(0, contributor.reputation - Math.floor(t.repReward * 0.5));
      contributor.tasksRejected++;
    }
    addFeed('rejected', t.title);
  }

  saveState(); renderAll();
  toast(decision === 'approve' ? 'Approved' : 'Rejected');
}

function renderDashboard() {

    return;
  }

  const totalTasks = S.tasks.length;
  const validated = S.tasks.filter(t => t.status === 'validated').length;
  const merged = S.tasks.filter(t => t.status === 'merged').length;
  const inProgress = S.tasks.filter(t => ['claimed','submitted','validating'].includes(t.status)).length;
  const openTasks = S.tasks.filter(t => t.status === 'open').length;
  const totalCreditsDistributed = S.ledger.filter(l => l.reason === 'task_reward').reduce((s,l) => s + l.delta, 0);
  const pct = totalTasks ? Math.round(((validated + merged) / totalTasks) * 100) : 0;

  let html = '<div class="stats-row">';
  html += '<div class="stat-card"><div class="stat-value green">' + (validated + merged) + '</div><div class="stat-label">Validated / Merged</div></div>';
  html += '<div class="stat-card"><div class="stat-value accent-c">' + inProgress + '</div><div class="stat-label">In Progress</div></div>';
  html += '<div class="stat-card"><div class="stat-value yellow">' + openTasks + '</div><div class="stat-label">Open Tasks</div></div>';
  html += '<div class="stat-card"><div class="stat-value purple">' + totalCreditsDistributed.toFixed(0) + '</div><div class="stat-label">Credits Distributed</div></div>';
  html += '</div>';

  if (totalTasks) {
    html += '<div class="card"><div class="card-header"><span class="card-title">Progress</span><span style="color:var(--green);font-weight:600">' + pct + '%</span></div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div></div>';
  }

  // Feed
  html += '<div class="card"><div class="card-header"><span class="card-title">Activity Feed</span></div>';
  if (S.feed.length) {
    html += S.feed.slice(0, 20).map(f => {
      const color = f.action.includes('validated') || f.action.includes('approved') ? 'var(--green)' :
                    f.action.includes('claimed') ? 'var(--yellow)' :
                    f.action.includes('rejected') ? 'var(--red)' :
                    f.action.includes('checkpoint') ? 'var(--purple)' : 'var(--accent)';
      return '<div class="feed-item"><div class="feed-avatar" style="background:'+color+'">' + (agentName(f.agent)||'S')[0].toUpperCase() + '</div><div class="feed-content"><strong>' + esc(agentName(f.agent)) + '</strong> ' + esc(f.action) + ' <strong>' + esc(f.detail) + '</strong> <span class="feed-time">' + ago(f.time) + '</span></div></div>';
    }).join('');
  } else {
    html += '<div style="padding:20px;color:var(--text-dim);text-align:center">No activity yet. Create a project and add tasks to get started.</div>';
  }
  html += '</div>';
  el.innerHTML = html;

  filters.innerHTML = statuses.map(s => {

  el.innerHTML = S.projects.map(p => {
    const tasks = S.tasks.filter(t => t.projectId === p.id);
    const done = tasks.filter(t => ['validated','merged'].includes(t.status)).length;
    const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
    return `<div class="card">
      <div class="card-header"><span class="card-title">${esc(p.title)}</span>${chip(p.status)}</div>
      <div style="color:var(--text-dim);font-size:0.85rem;margin-bottom:8px">${esc(p.description || '')}</div>
      <div style="display:flex;gap:16px;font-size:0.85rem;color:var(--text-dim);margin-bottom:8px">
        <span>Tasks: ${tasks.length}</span>
        <span>Done: ${done}</span>
        <span>Pool: <strong style="color:var(--green)">${p.creditPoolRemaining.toFixed(0)}</strong> / ${p.creditPool.toFixed(0)} cr</span>
        <span>Builds: ${p.buildCount}</span>
        <span>Tier: ${p.tier}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="margin-top:4px;font-size:0.8rem;color:var(--text-dim)">${pct}% complete</div>
    </div>`;
  }).join('');
}

function renderLedger() {
  const el = document.getElementById('ledger-table');
  if (!S.ledger.length) {
    el.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:40px">No transactions yet</td></tr>';
    return;
  }
  el.innerHTML = S.ledger.map(l => {
    const color = l.delta >= 0 ? 'var(--green)' : 'var(--red)';
    return '<tr><td style="color:var(--text-dim)">' + ago(l.time) + '</td><td><strong>' + esc(agentName(l.agentId)) + '</strong></td><td style="color:'+color+';font-weight:600">' + (l.delta >= 0 ? '+' : '') + l.delta.toFixed(2) + '</td><td>' + l.balanceAfter.toFixed(2) + '</td><td>' + l.reason.replace(/_/g,' ') + '</td><td>' + esc(l.taskTitle) + '</td></tr>';
  }).join('');
}

function updateNav() {
  document.getElementById('nav-tasks').textContent = S.tasks.length;
  document.getElementById('nav-agents').textContent = S.agents.length;
  document.getElementById('nav-validate').textContent = S.contributions.filter(c => c.status === 'pending_review').length;
  document.getElementById('nav-projects').textContent = S.projects.length;
  document.getElementById('nav-ledger').textContent = S.ledger.length;

  // Header
  document.getElementById('hdr-agents').textContent = S.agents.length + ' agents';
  const totalPool = S.projects.reduce((s,p) => s + p.creditPoolRemaining, 0);
  document.getElementById('hdr-pool').textContent = 'Pool: ' + totalPool.toFixed(0) + ' cr';
  const me = agent(S.currentAgent);
  document.getElementById('hdr-avatar').textContent = me ? me.name[0].toUpperCase() : '?';
  document.getElementById('hdr-avatar').title = me ? me.name + ' (' + me.credits.toFixed(2) + ' cr)' : 'Not registered';
  document.getElementById('hdr-avatar').onclick = () => openModal('setup');
}

function renderAll() {
  renderDashboard();
  renderTaskBoard();
  renderAgentsPage();
  renderValidation();
  renderProjects();
  renderLedger();
  updateNav();
}

renderAll();
</script>
</body>
</html>
